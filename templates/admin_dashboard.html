<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>

    <h1>Admin Dashboard</h1>
    <p>Welcome Admin</p>

    <ul>
        <li>Total Treks: {{ total_treks }}</li>
        <li>Total Users: {{ total_users }}</li>
        <li>Total Staff: {{ total_staff }}</li>
        <li>Total Bookings: {{ total_bookings }}</li>
    </ul>

    <br>

    <a href="{{ url_for('admin_treks') }}">Manage Treks</a> |
    <a href="{{ url_for('admin_staff') }}">Manage Staff</a> |
    <a href="{{ url_for('admin_users') }}">Manage Users</a> |
    <a href="{{ url_for('admin_bookings') }}">View Bookings</a>

    <br><br>

    <form method="GET" action="{{ url_for('admin_search') }}">
        <input type="text" name="q" placeholder="Search by name or ID">
        <select name="type">
            <option value="trek">Trek</option>
            <option value="staff">Staff</option>
            <option value="user">User</option>
        </select>
        <button type="submit">Search</button>
    </form>

    <br>

    <a href="{{ url_for('logout') }}">Logout</a>

</body>
</html>
